# CI for winer: the plugin and the window's frontend, the Rust workspace on Windows, and the release
# configuration. The commands are AGENTS.md's baseline; `CI Success` is the one status the ruleset
# on `main` requires.
#
# winer ships for Windows only, so the Rust workspace is built and tested on Windows alone; the
# release workflow's bundle leg is the proof that the installer builds. The frontend and the release
# configuration jobs build and test nothing for any platform (Node and Python tooling, the same
# output on every OS), so they stay on the cheaper Ubuntu runners.
#
# A release PR and the squash commit it lands as change nothing but release-please's version bump,
# on code CI has just tested on main: `Changes` proves that (.github/scripts/release-fast-lane.py)
# and then the Rust and frontend jobs are skipped. Every other run builds and tests everything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAURI_PROJECT_PATH: app/src-tauri
  RELEASE_TARGETS_FILE: .github/release-targets.json
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.lane.outputs.fast }}
    steps:
      # The head and its parent, which is the base of a release-please commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether this is only release-please's version bump
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The release app that opens the release PRs (release.yml), as repository variables.
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          RELEASE_BOT_EMAIL: ${{ vars.RELEASE_BOT_EMAIL }}
        run: python3 .github/scripts/release-fast-lane.py

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  windows:
    name: Rust (Windows)
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds build.frontendDist at compile time and build.rs embeds the
      # plugin, so both are built before anything compiles.
      - name: Build the plugin and the frontend for embedding
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: tauri-ci-windows

      - name: Format check
        shell: bash
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # In a whole-workspace build a reqwest feature the app turns on is on for every crate, so the
      # two library crates are also built and tested on their own.
      - name: Test the library crates on their own
        shell: bash
        run: cargo test --locked -p lcu -p winer-core

      - name: Test the workspace
        shell: bash
        run: cargo test --locked --workspace

  config:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tauri.conf.json, package.json and the updater pubkey
        run: >-
          python3 .github/scripts/tauri-release.py check-config
          --project "$TAURI_PROJECT_PATH" --targets-file "$RELEASE_TARGETS_FILE"

      - name: Validate the release target manifest
        run: python3 .github/scripts/tauri-release.py matrix --file "$RELEASE_TARGETS_FILE"

      - name: Test the release fast lane's rules
        run: python3 .github/scripts/release-fast-lane.py --self-test

  ci-success:
    name: CI Success
    needs: [changes, frontend, windows, config]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skip passes only for the two jobs the fast lane leaves out, and only once `Changes` has
      # proved the run is a version bump; any other skip fails.
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FAST: ${{ needs.changes.outputs.fast }}
        run: |
          jq -e --arg fast "$FAST" '
            .changes.result == "success" and .config.result == "success" and
            ([.frontend.result, .windows.result] | all(
              . == "success" or (. == "skipped" and $fast == "true")))' <<<"$NEEDS_JSON"
