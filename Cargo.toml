[workspace]
resolver = "3"
members = ["crates/lcu", "crates/core", "app/src-tauri"]

[workspace.package]
# Static on purpose: the app's version lives in the root package.json alone (release-please bumps it,
# tauri.conf.json and app/src-tauri/build.rs read it), so a release never touches Cargo.lock.
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sunerpy/winer"

# Every version is exact. A dependency bump is a deliberate edit here, never a side effect of
# `cargo update` on another machine.
[workspace.dependencies]
lcu = { path = "crates/lcu" }
winer-core = { path = "crates/core" }

base64 = "=0.22.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "=0.4.3"
# `system-proxy` lets a client read the proxy set in Windows' settings, which a GUI app otherwise
# never sees (it has no HTTPS_PROXY). It is on for the updater, whose reqwest is this one: in
# China GitHub is often reachable only through that proxy. The LCU and game-data clients opt out
# with `no_proxy()`. `gzip` asks for compressed answers and unpacks them: a page of 50 games from
# the shard's server is about 6.5 MB as JSON. The LCU's client opts out with `no_gzip()`.
reqwest = { version = "=0.13.4", default-features = false, features = [
  "gzip",
  "rustls-no-provider",
  "system-proxy",
] }
rustls = { version = "=0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }
tokio-rustls = { version = "=0.26.4", default-features = false }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
windows-sys = "=0.61.2"

tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-build = "=2.6.3"
embed-resource = "=3.0.11"
tauri-plugin-autostart = "=2.5.1"
# 2.4 wants tauri 2.12 and tauri-plugin 2.7, newer than the set pinned in app/src-tauri; 2.3.2 is
# the last release that builds against tauri 2.11.5.
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = [
  "rustls-tls",
  "zip",
] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
] }

tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# A release rebuilds winer's own three crates only (every dependency comes from the cache), and one
# codegen unit leaves each of them a single LLVM thread: 5m10s on the 4-core release runner for
# 0.0.5. Four units, one per core, halve that; the dependencies keep one. Measured on four jobs
# (2026-10-07): 121 s and a 21.4 MB winer.exe with one unit, 67 s and 22.8 MB with four, 61 s and
# 23.3 MB with sixteen.
[profile.release.package.winer]
codegen-units = 4

[profile.release.package.winer-core]
codegen-units = 4

[profile.release.package.lcu]
codegen-units = 4
