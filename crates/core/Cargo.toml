[package]
name = "winer-core"
description = "winer's domain: the client connection, live views, automation and the plugin bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-util.workspace = true
getrandom.workspace = true
lcu.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
# Raw values: the client's item sets that are not winer's go back exactly as they came.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util`: tests that wait minutes on the client run on a paused clock.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
